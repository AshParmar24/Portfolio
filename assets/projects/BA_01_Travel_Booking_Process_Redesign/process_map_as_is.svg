<path d="M1317.0 305.0 L1317.0 130.0" fill="none" stroke="#57534e" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="211.0" cy="110.0" r="20" fill="#e6f4f4" stroke="#4a3550" stroke-width="1.5"/>
<text x="211.0" y="146.0" font-size="10.5" text-anchor="middle" fill="#44403c">Wants a holiday</text>
<rect x="308.0" y="81.0" width="122" height="58" rx="8" fill="#ffffff" stroke="#7e4fa8" stroke-width="1.5"/>
<text x="369.0" y="101.0" font-size="11" text-anchor="middle" fill="#1c1917">Phones, emails, fills</text>
<text x="369.0" y="114.0" font-size="11" text-anchor="middle" fill="#1c1917">in web form or walks</text>
<text x="369.0" y="127.0" font-size="11" text-anchor="middle" fill="#1c1917">in</text>
<rect x="308.0" y="193.0" width="122" height="58" rx="8" fill="#ffffff" stroke="#7e4fa8" stroke-width="1.5"/>
<text x="369.0" y="219.5" font-size="11" text-anchor="middle" fill="#1c1917">Picks up enquiry when</text>
<text x="369.0" y="232.5" font-size="11" text-anchor="middle" fill="#1c1917">free (shared inbox)</text>
<circle cx="428.0" cy="195.0" r="10" fill="#b3261e"/><text x="428.0" y="199.0" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">1</text>
<rect x="466.0" y="193.0" width="122" height="58" rx="8" fill="#ffffff" stroke="#7e4fa8" stroke-width="1.5"/>
<text x="527.0" y="219.5" font-size="11" text-anchor="middle" fill="#1c1917">Logs details in own</text>
<text x="527.0" y="232.5" font-size="11" text-anchor="middle" fill="#1c1917">spreadsheet</text>
<circle cx="586.0" cy="195.0" r="10" fill="#b3261e"/><text x="586.0" y="199.0" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">2</text>
<rect x="624.0" y="193.0" width="122" height="58" rx="8" fill="#ffffff" stroke="#7e4fa8" stroke-width="1.5"/>
<text x="685.0" y="213.0" font-size="11" text-anchor="middle" fill="#1c1917">Searches supplier</text>
<text x="685.0" y="226.0" font-size="11" text-anchor="middle" fill="#1c1917">sites; types quote in</text>
<text x="685.0" y="239.0" font-size="11" text-anchor="middle" fill="#1c1917">Word</text>
<circle cx="744.0" cy="195.0" r="10" fill="#b3261e"/><text x="744.0" y="199.0" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">3</text>
<rect x="624.0" y="81.0" width="122" height="58" rx="8" fill="#ffffff" stroke="#7e4fa8" stroke-width="1.5"/>
<text x="685.0" y="107.5" font-size="11" text-anchor="middle" fill="#1c1917">Receives quote by</text>
<text x="685.0" y="120.5" font-size="11" text-anchor="middle" fill="#1c1917">email</text>
<path d="M799.0 110.0 L843.0 76.0 L887.0 110.0 L843.0 144.0 z" fill="#fff7e0" stroke="#c27a00" stroke-width="1.5"/>
<text x="843.0" y="107.5" font-size="10" text-anchor="middle" fill="#1c1917">Happy with</text>
<text x="843.0" y="120.5" font-size="10" text-anchor="middle" fill="#1c1917">quote?</text>
<rect x="782.0" y="193.0" width="122" height="58" rx="8" fill="#ffffff" stroke="#7e4fa8" stroke-width="1.5"/>
<text x="843.0" y="219.5" font-size="11" text-anchor="middle" fill="#1c1917">Revises quote, or</text>
<text x="843.0" y="232.5" font-size="11" text-anchor="middle" fill="#1c1917">chases if remembered</text>
<circle cx="902.0" cy="195.0" r="10" fill="#b3261e"/><text x="902.0" y="199.0" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">4</text>
<rect x="940.0" y="193.0" width="122" height="58" rx="8" fill="#ffffff" stroke="#7e4fa8" stroke-width="1.5"/>
<text x="1001.0" y="219.5" font-size="11" text-anchor="middle" fill="#1c1917">Retypes booking into</text>
<text x="1001.0" y="232.5" font-size="11" text-anchor="middle" fill="#1c1917">supplier portal</text>
<circle cx="1060.0" cy="195.0" r="10" fill="#b3261e"/><text x="1060.0" y="199.0" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">5</text>
<rect x="940.0" y="417.0" width="122" height="58" rx="8" fill="#ffffff" stroke="#7e4fa8" stroke-width="1.5"/>
<text x="1001.0" y="450.0" font-size="11" text-anchor="middle" fill="#1c1917">Confirms booking</text>
<rect x="1098.0" y="305.0" width="122" height="58" rx="8" fill="#ffffff" stroke="#7e4fa8" stroke-width="1.5"/>
<text x="1159.0" y="325.0" font-size="11" text-anchor="middle" fill="#1c1917">Takes card details by</text>
<text x="1159.0" y="338.0" font-size="11" text-anchor="middle" fill="#1c1917">phone; keys into</text>
<text x="1159.0" y="351.0" font-size="11" text-anchor="middle" fill="#1c1917">terminal</text>
<circle cx="1218.0" cy="307.0" r="10" fill="#b3261e"/><text x="1218.0" y="311.0" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">6</text>
<rect x="1256.0" y="305.0" width="122" height="58" rx="8" fill="#ffffff" stroke="#7e4fa8" stroke-width="1.5"/>
<text x="1317.0" y="331.5" font-size="11" text-anchor="middle" fill="#1c1917">Produces confirmation</text>
<text x="1317.0" y="344.5" font-size="11" text-anchor="middle" fill="#1c1917">and ATOL Certificate</text>
<circle cx="1317.0" cy="110.0" r="20" fill="#4a3550" stroke="#4a3550" stroke-width="3"/>
<text x="1317.0" y="82.0" font-size="10.5" text-anchor="middle" fill="#44403c">Receives documents</text>
<text x="16" y="532" font-size="12" font-weight="700" fill="#b3261e">Pain points found in the as-is process</text>
<circle cx="24" cy="548" r="8" fill="#b3261e"/><text x="24" y="552" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">1</text>
<text x="40" y="552" font-size="11.5" fill="#44403c">Written enquiries wait a median of 15 hours for a first reply; only 5 percent are answered within 2 hours.</text>
<circle cx="24" cy="568" r="8" fill="#b3261e"/><text x="24" y="572" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">2</text>
<text x="40" y="572" font-size="11.5" fill="#44403c">Each consultant logs enquiries in a personal spreadsheet, so managers cannot see the pipeline.</text>
<circle cx="24" cy="588" r="8" fill="#b3261e"/><text x="24" y="592" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">3</text>
<text x="40" y="592" font-size="11.5" fill="#44403c">Quotes are typed into a Word template and retyped for each revision (tailor-made quotes average 2.8 versions).</text>
<circle cx="24" cy="608" r="8" fill="#b3261e"/><text x="24" y="612" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">4</text>
<text x="40" y="612" font-size="11.5" fill="#44403c">Follow-up relies on memory: 43 percent of quotes are never chased.</text>
<circle cx="24" cy="628" r="8" fill="#b3261e"/><text x="24" y="632" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">5</text>
<text x="40" y="632" font-size="11.5" fill="#44403c">Details are typed a third time into the supplier portal; 10 percent of bookings need a correction.</text>
<circle cx="24" cy="648" r="8" fill="#b3261e"/><text x="24" y="652" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">6</text>
<text x="40" y="652" font-size="11.5" fill="#44403c">Card details are taken by phone, and the confirmation and ATOL Certificate follow later.</text>
</svg>